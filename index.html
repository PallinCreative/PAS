<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Det Optimale Livshjulet</title>
    <link rel="stylesheet" href="shared-styles.css">
    <style>
        /* Lokale stiler kun for hjulet */
        main { flex: 1; display: flex; justify-content: center; align-items: center; padding: 3rem 2rem; }
        #wheel-container { width: 95vw; max-width: 780px; aspect-ratio: 1 / 1; filter: drop-shadow(0 20px 50px rgba(0,0,0,0.15)); }
        svg { width: 100%; height: 100%; display: block; }
        .interactive-slice { cursor: pointer; transition: filter 0.2s ease; stroke: white; stroke-width: 2px; }
        .interactive-slice:hover { filter: brightness(1.12) saturate(1.1); stroke-width: 3px; }
        .radial-text { font-size: 14px; font-weight: 800; fill: #000; }
        .arc-text-title { font-size: 20px; font-weight: bold; fill: white; }
        .arc-text-desc { font-size: 15px; font-weight: 600; fill: white; text-shadow: 0px 1px 3px rgba(0,0,0,0.5); }
        .inner-ring-text { font-size: 16px; font-weight: 900; fill: #000; letter-spacing: 0.5px; }
    </style>
</head>
<body>

    <div id="pas-header-container"></div>

    <main>
        <div id="wheel-container"></div>
    </main>

    <div id="pas-footer-container"></div>

    <script src="site-data.js"></script>
    <script src="pas-components.js"></script>
    
    <script>
        const CX = 500, CY = 500, R_CENTER = 70, R_RING1 = 120, R_RING2 = 310, R_RING3 = 460;
        const totalSlices = 13;
        const sliceAngle = 360 / totalSlices;

        function getCoords(cx, cy, r, angleDeg) {
            let rad = angleDeg * Math.PI / 180;
            return { x: cx + r * Math.cos(rad), y: cy + r * Math.sin(rad) };
        }

        function createSlicePath(cx, cy, rIn, rOut, startAngle, endAngle) {
            let p1 = getCoords(cx, cy, rIn, startAngle), p2 = getCoords(cx, cy, rOut, startAngle);
            let p3 = getCoords(cx, cy, rOut, endAngle), p4 = getCoords(cx, cy, rIn, endAngle);
            let largeArc = endAngle - startAngle <= 180 ? "0" : "1";
            return `M ${p1.x} ${p1.y} L ${p2.x} ${p2.y} A ${rOut} ${rOut} 0 ${largeArc} 1 ${p3.x} ${p3.y} L ${p4.x} ${p4.y} A ${rIn} ${rIn} 0 ${largeArc} 0 ${p1.x} ${p1.y} Z`;
        }

        function createTextPath(id, cx, cy, r, startAngle, endAngle) {
            let midAngle = (startAngle + endAngle) / 2;
            let normalizedMid = ((midAngle % 360) + 360) % 360; 
            let pStart, pEnd, sweepFlag;
            if (normalizedMid > 180 && normalizedMid < 360) {
                pStart = getCoords(cx, cy, r, startAngle); pEnd = getCoords(cx, cy, r, endAngle); sweepFlag = 1;
            } else {
                pStart = getCoords(cx, cy, r, endAngle); pEnd = getCoords(cx, cy, r, startAngle); sweepFlag = 0;
            }
            return `<path id="${id}" d="M ${pStart.x} ${pStart.y} A ${r} ${r} 0 0 ${sweepFlag} ${pEnd.x} ${pEnd.y}" fill="none" />`;
        }

        function generateWheel() {
            let svgStr = `<svg viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg"><defs>
                <filter id="textShadow" x="-20%" y="-20%" width="140%" height="140%">
                    <feGaussianBlur in="SourceAlpha" stdDeviation="1.5" />
                    <feOffset dx="0.5" dy="0.5" result="offsetblur" />
                    <feComponentTransfer><feFuncA type="linear" slope="0.5" /></feComponentTransfer>
                    <feMerge><feMergeNode /><feMergeNode in="SourceGraphic" /></feMerge>
                </filter>`;
            let slicesStr = "", labelsStr = "", currentAngle = 180;

            PAS_DATA.forEach((mainCat, catIndex) => {
                let catStartAngle = currentAngle;
                mainCat.slices.forEach((slice) => {
                    let endAngle = currentAngle + sliceAngle;
                    let midAngle = (currentAngle + endAngle) / 2;
                    let textRadius = (R_RING1 + R_RING2) / 2;
                    let textPos = getCoords(CX, CY, textRadius, midAngle);
                    slicesStr += `<path class="interactive-slice" d="${createSlicePath(CX, CY, R_RING1, R_RING2, currentAngle, endAngle)}" fill="${slice.color}" onclick="window.location.href='${slice.link}'"><title>${slice.label}</title></path>`;
                    let textRot = midAngle;
                    if (((midAngle % 360) + 360) % 360 > 90 && ((midAngle % 360) + 360) % 360 < 270) textRot += 180;
                    let lines = slice.label.split('|');
                    let textSvg = `<text class="radial-text" transform="rotate(${textRot}, ${textPos.x}, ${textPos.y})" text-anchor="middle">`;
                    lines.forEach((line, i) => { textSvg += `<tspan x="${textPos.x}" y="${textPos.y}" dy="${(i - (lines.length-1)/2) * 16 + 5}">${line}</tspan>`; });
                    labelsStr += textSvg + `</text>`;
                    currentAngle = endAngle;
                });
                let catEndAngle = currentAngle;
                let midCatAngle = (catStartAngle + catEndAngle) / 2;
                let isTopHalf = (((midCatAngle % 360) + 360) % 360) > 180 && (((midCatAngle % 360) + 360) % 360) < 360;
                let titleRadius = isTopHalf ? 415 : 355, descRadius = isTopHalf ? 355 : 415;
                slicesStr += `<path class="interactive-slice" d="${createSlicePath(CX, CY, R_RING2, R_RING3, catStartAngle, catEndAngle)}" fill="${mainCat.colorMain}" onclick="window.location.href='${mainCat.link}'"></path>`;
                let pathIdMain = `path_main_${catIndex}`;
                svgStr += createTextPath(pathIdMain, CX, CY, titleRadius, catStartAngle, catEndAngle);
                labelsStr += `<text class="arc-text-title" dy="0.35em"><textPath href="#${pathIdMain}" startOffset="50%" text-anchor="middle">${mainCat.mainLabel}</textPath></text>`;
                let pathIdDesc = `path_desc_${catIndex}`;
                svgStr += createTextPath(pathIdDesc, CX, CY, descRadius, catStartAngle, catEndAngle);
                labelsStr += `<text class="arc-text-desc" dy="0.35em" filter="url(#textShadow)"><textPath href="#${pathIdDesc}" startOffset="50%" text-anchor="middle">${mainCat.descLabel}</textPath></text>`;
            });

            slicesStr += `<circle cx="${CX}" cy="${CY}" r="${R_RING1}" fill="white" stroke="#333" stroke-width="1.5"></circle>`;
            [{label:"Inkludering",s:225,e:315},{label:"Ikke-ubehagelig",s:321.5,e:411.5},{label:"Valg",s:45,e:135},{label:"Kommunikasjon",s:128.6,e:218.6}].forEach((sec, i) => {
                let pid = `p_in_${i}`;
                svgStr += createTextPath(pid,CX,CY,(R_CENTER+R_RING1)/2,sec.s,sec.e);
                labelsStr += `<text class="inner-ring-text" dy="0.35em"><textPath href="#${pid}" startOffset="50%" text-anchor="middle">${sec.label}</textPath></text>`;
            });

            [59.6, 120.4, 226.6, 313.4].forEach(a => {
                let p = getCoords(CX, CY, (R_CENTER + R_RING1)/2, a);
                labelsStr += `<g transform="translate(${p.x}, ${p.y}) rotate(${a + 90})"><path d="M-10 0 L8 0" stroke="black" stroke-width="2.5"/><path d="M3 -5 L11 0 L3 5 Z" fill="black"/></g>`;
            });

            slicesStr += `<circle cx="${CX}" cy="${CY}" r="${R_CENTER}" fill="black"></circle><circle cx="${CX}" cy="${CY-15}" r="14" fill="white"/><path d="M${CX-30} ${CY+5} Q${CX} ${CY-15} ${CX+30} ${CY+5} L${CX+20} ${CY+15} Q${CX} ${CY} ${CX-20} ${CY+15} Z" fill="white"/><rect x="${CX-15}" y="${CY-2}" width="30" height="35" rx="8" fill="white"/>`;
            labelsStr += `<text x="${CX}" y="${CY+45}" fill="white" font-size="12" font-weight="bold" text-anchor="middle">Person</text><text x="${CX}" y="${CY+58}" fill="white" font-size="12" font-weight="bold" text-anchor="middle">sentrert</text>`;

            document.getElementById('wheel-container').innerHTML = svgStr + `</defs>` + slicesStr + labelsStr + `</svg>`;
        }

        window.addEventListener('load', generateWheel);
    </script>
</body>
</html>
