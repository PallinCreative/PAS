<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Det Optimale Livshjulet</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f4f7f6;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        #wheel-container {
            width: 95vw;
            max-width: 850px;
            height: auto;
            aspect-ratio: 1 / 1;
            filter: drop-shadow(0 10px 25px rgba(0,0,0,0.12));
            background-color: transparent;
        }

        svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* All tekst skal ignorere musen fullstendig for å ikke blokkere hover på stykkene under */
        svg text, svg tspan, textPath {
            user-select: none;
            -webkit-user-select: none;
            pointer-events: none;
            text-rendering: optimizeLegibility;
        }

        .interactive-slice {
            cursor: pointer;
            transition: filter 0.15s ease-out, stroke 0.15s ease-out;
            stroke: white;
            stroke-width: 2px;
        }

        /* Hover-effekt kun på selve kakestykket */
        .interactive-slice:hover {
            filter: brightness(1.15);
            stroke: #ffffff;
            stroke-width: 3px;
        }

        /* Tekststiler - Statiske størrelser */
        .radial-text { font-size: 14px; font-weight: 800; fill: #000; }
        .arc-text-title { font-size: 20px; font-weight: bold; fill: white; }
        .arc-text-desc { font-size: 13px; fill: white; }
        .inner-ring-text { font-size: 16px; font-weight: 900; fill: #000; letter-spacing: 0.5px; }

    </style>
</head>
<body>

    <div id="wheel-container"></div>

    <script>
        const data = [
            {
                id: "relasjoner",
                mainLabel: "Mellommenneskelige relasjoner",
                descLabel: "Hvem liker jeg å være sammen med & hva kan vi finne på sammen",
                colorMain: "#6A2B86", colorDesc: "#6A2B86",
                link: "relasjoner.html", 
                slices: [
                    { label: "Min familie", color: "#936AB0", link: "familie.html" },
                    { label: "Mine venner", color: "#A985C1", link: "venner.html" },
                    { label: "Mine hjelpere", color: "#C4ACD7", link: "hjelpere.html" },
                    { label: "Lokal-|samfunnet|mitt", color: "#E5DAED", link: "lokalsamfunn.html" }
                ]
            },
            {
                id: "omgivelser",
                mainLabel: "Fysiske omgivelser",
                descLabel: "Steder jeg liker å være & hvordan jeg liker at de skal være",
                colorMain: "#00747A", colorDesc: "#00747A",
                link: "omgivelser.html",
                slices: [
                    { label: "Hjemmet|mitt", color: "#009FA5", link: "hjemmet.html" },
                    { label: "Steder|utenfor|hjemmet mitt", color: "#76CDD0", link: "steder-utenfor.html" },
                    { label: "Personalets|ferdigheter|& kunnskaper", color: "#D5EFEF", link: "personale.html" }
                ]
            },
            {
                id: "tid",
                mainLabel: "Meningsfull tid",
                descLabel: "Ting jeg liker å gjøre & planer for ukene som kommer",
                colorMain: "#2B5592", colorDesc: "#2B5592",
                link: "tid.html",
                slices: [
                    { label: "Mitt arbeid", color: "#678EC9", link: "arbeid.html" },
                    { label: "Fritid og|moro", color: "#A2C0E2", link: "fritid.html" },
                    { label: "Mine|aktiviteter", color: "#D9E8F5", link: "aktiviteter.html" }
                ]
            },
            {
                id: "utvikling",
                mainLabel: "Personlig utvikling",
                descLabel: "Lære nye ferdigheter",
                colorMain: "#A9225E", colorDesc: "#A9225E",
                link: "utvikling.html",
                slices: [
                    { label: "Kommunikasjons-|ferdigheter", color: "#D97CA4", link: "kommunikasjon.html" },
                    { label: "Lære nye|ferdigheter", color: "#F2CADB", link: "ferdigheter.html" }
                ]
            },
            {
                id: "helse",
                mainLabel: "Helse",
                descLabel: "Best mulig helse for meg",
                colorMain: "#727679", colorDesc: "#727679",
                link: "helse.html",
                slices: [
                    { label: "Best mulig|helse", color: "#B5B7B9", link: "helse-detaljer.html" }
                ]
            }
        ];

        const CX = 500, CY = 500, R_CENTER = 70, R_RING1 = 120, R_RING2 = 310, R_RING3 = 460;
        const totalSlices = 13;
        const sliceAngle = 360 / totalSlices;

        function getCoords(cx, cy, r, angleDeg) {
            let rad = angleDeg * Math.PI / 180;
            return { x: cx + r * Math.cos(rad), y: cy + r * Math.sin(rad) };
        }

        function createSlicePath(cx, cy, rIn, rOut, startAngle, endAngle) {
            let p1 = getCoords(cx, cy, rIn, startAngle);
            let p2 = getCoords(cx, cy, rOut, startAngle);
            let p3 = getCoords(cx, cy, rOut, endAngle);
            let p4 = getCoords(cx, cy, rIn, endAngle);
            let largeArc = endAngle - startAngle <= 180 ? "0" : "1";
            return `M ${p1.x} ${p1.y} L ${p2.x} ${p2.y} A ${rOut} ${rOut} 0 ${largeArc} 1 ${p3.x} ${p3.y} L ${p4.x} ${p4.y} A ${rIn} ${rIn} 0 ${largeArc} 0 ${p1.x} ${p1.y} Z`;
        }

        function createTextPath(id, cx, cy, r, startAngle, endAngle) {
            let midAngle = (startAngle + endAngle) / 2;
            let normalizedMid = ((midAngle % 360) + 360) % 360; 
            let pStart, pEnd, sweepFlag;
            if (normalizedMid > 180 && normalizedMid < 360) {
                pStart = getCoords(cx, cy, r, startAngle); pEnd = getCoords(cx, cy, r, endAngle); sweepFlag = 1;
            } else {
                pStart = getCoords(cx, cy, r, endAngle); pEnd = getCoords(cx, cy, r, startAngle); sweepFlag = 0;
            }
            return `<path id="${id}" d="M ${pStart.x} ${pStart.y} A ${r} ${r} 0 0 ${sweepFlag} ${pEnd.x} ${pEnd.y}" fill="none" />`;
        }

        function generateWheel() {
            let svgStr = `<svg viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg"><defs>`;
            let slicesStr = "", labelsStr = "", currentAngle = 180;

            data.forEach((mainCat, catIndex) => {
                let catStartAngle = currentAngle;
                mainCat.slices.forEach((slice) => {
                    let endAngle = currentAngle + sliceAngle;
                    let midAngle = (currentAngle + endAngle) / 2;
                    let textRadius = (R_RING1 + R_RING2) / 2;
                    let textPos = getCoords(CX, CY, textRadius, midAngle);
                    
                    let onClickAction = (slice.link && slice.link !== "DIN_LINK_HER") ? `onclick="window.location.href='${slice.link}'"` : "";

                    slicesStr += `<path class="interactive-slice" d="${createSlicePath(CX, CY, R_RING1, R_RING2, currentAngle, endAngle)}" fill="${slice.color}" ${onClickAction}>
                            <title>${slice.label.replace(/\|/g, ' ')}</title>
                        </path>`;

                    let textRot = midAngle;
                    if (((midAngle % 360) + 360) % 360 > 90 && ((midAngle % 360) + 360) % 360 < 270) textRot += 180;

                    let lines = slice.label.split('|');
                    let textSvg = `<text class="radial-text" transform="rotate(${textRot}, ${textPos.x}, ${textPos.y})" text-anchor="middle">`;
                    lines.forEach((line, i) => {
                        let yOffset = (i - (lines.length-1)/2) * 16 + 5;
                        textSvg += `<tspan x="${textPos.x}" y="${textPos.y}" dy="${yOffset}">${line}</tspan>`;
                    });
                    labelsStr += textSvg + `</text>`;
                    currentAngle = endAngle;
                });

                let catEndAngle = currentAngle;
                let midCatAngle = (catStartAngle + catEndAngle) / 2;
                let isTopHalf = (((midCatAngle % 360) + 360) % 360) > 180 && (((midCatAngle % 360) + 360) % 360) < 360;
                let titleRadius = isTopHalf ? 415 : 355, descRadius = isTopHalf ? 355 : 415;

                let mainOnClick = (mainCat.link && mainCat.link !== "DIN_LINK_HER") ? `onclick="window.location.href='${mainCat.link}'"` : "";
                
                slicesStr += `<path class="interactive-slice" d="${createSlicePath(CX, CY, R_RING2, R_RING3, catStartAngle, catEndAngle)}" fill="${mainCat.colorMain}" stroke-width="3" ${mainOnClick}>
                        <title>${mainCat.mainLabel}</title></path>`;

                let pathIdMain = `path_main_${catIndex}`;
                svgStr += createTextPath(pathIdMain, CX, CY, titleRadius, catStartAngle, catEndAngle);
                labelsStr += `<text class="arc-text-title" dy="0.35em"><textPath href="#${pathIdMain}" startOffset="50%" text-anchor="middle">${mainCat.mainLabel}</textPath></text>`;

                let pathIdDesc = `path_desc_${catIndex}`;
                svgStr += createTextPath(pathIdDesc, CX, CY, descRadius, catStartAngle, catEndAngle);
                labelsStr += `<text class="arc-text-desc" dy="0.35em"><textPath href="#${pathIdDesc}" startOffset="50%" text-anchor="middle">${mainCat.descLabel}</textPath></text>`;
            });

            slicesStr += `<circle cx="${CX}" cy="${CY}" r="${R_RING1}" fill="white" stroke="#333" stroke-width="2"></circle>`;
            let innerSections = [
                { label: "Inkludering", start: 225, end: 315 }, { label: "Ikke-ubehagelig", start: 321.5, end: 411.5 },
                { label: "Valg", start: 45, end: 135 }, { label: "Kommunikasjon", start: 128.6, end: 218.6 }
            ];

            innerSections.forEach((sec, i) => {
                let pathIdInner = `path_inner_${i}`;
                svgStr += createTextPath(pathIdInner, CX, CY, (R_CENTER + R_RING1)/2, sec.start, sec.end);
                labelsStr += `<text class="inner-ring-text" dy="0.35em"><textPath href="#${pathIdInner}" startOffset="50%" text-anchor="middle">${sec.label}</textPath></text>`;
            });

            let eqAngles = [59.6, 120.4, 226.6, 313.4];
            eqAngles.forEach(angle => {
                let p = getCoords(CX, CY, (R_CENTER + R_RING1)/2, angle);
                labelsStr += `<g transform="translate(${p.x}, ${p.y}) rotate(${angle + 90})" pointer-events="none">
                    <line x1="-8" y1="-3" x2="8" y2="-3" stroke="black" stroke-width="2.5" stroke-linecap="round" />
                    <line x1="-8" y1="3" x2="8" y2="3" stroke="black" stroke-width="2.5" stroke-linecap="round" /></g>`;
            });

            slicesStr += `<circle cx="${CX}" cy="${CY}" r="${R_CENTER}" fill="black" stroke="#333" stroke-width="2"></circle>
                <circle cx="${CX}" cy="${CY - 15}" r="14" fill="white" />
                <path d="M ${CX-30} ${CY+5} Q ${CX} ${CY-15} ${CX+30} ${CY+5} L ${CX+20} ${CY+15} Q ${CX} ${CY} ${CX-20} ${CY+15} Z" fill="white"/>
                <rect x="${CX-15}" y="${CY-2}" width="30" height="35" rx="8" fill="white" />`;
            labelsStr += `<text x="${CX}" y="${CY+45}" fill="white" font-size="12" font-weight="bold" text-anchor="middle">Person</text>
                <text x="${CX}" y="${CY+58}" fill="white" font-size="12" font-weight="bold" text-anchor="middle">sentrert</text>`;

            document.getElementById('wheel-container').innerHTML = svgStr + `</defs>` + slicesStr + labelsStr + `</svg>`;
        }

        window.onload = generateWheel;
    </script>
</body>
</html>
